name: JAV Worker

on:
  repository_dispatch:
    types: [jav-task]
  workflow_dispatch:
    inputs:
      task_id:
        description: 'Task ID (input yang dimasukkan user)'
        required: true
        default: 'vema 263'

permissions:
  contents: write

concurrency:
  group: jav-worker
  cancel-in-progress: false

jobs:
  run-task:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Set task id
        id: task
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TID="${{ github.event.inputs.task_id }}"
          else
            TID="${{ github.event.client_payload.task_id }}"
          fi
          echo "TID=$TID" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-v1

      - name: Install deps
        run: |
          pip install -r worker/requirements.txt
          python -m playwright install chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg >/dev/null

      - name: Run worker
        env:
          API_BASE: ${{ secrets.API_BASE }}
          WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_REPO: ${{ secrets.GH_REPO }}
          GH_BRANCH: ${{ vars.GH_BRANCH }}
          GDRIVE_FOLDER: ${{ vars.GDRIVE_FOLDER }}
          TASK_ID: ${{ steps.task.outputs.TID }}
        run: python worker/main.py "$TASK_ID"
        shell: bash