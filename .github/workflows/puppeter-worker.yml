name: Puppeter Worker

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: "Task ID yang akan diproses"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: puppeter-worker-${{ inputs.task_id }}
  cancel-in-progress: false

jobs:
  worker:
    name: Run Puppeter / Playwright
    runs-on: ubuntu-latest

    timeout-minutes: 60

    env:
      TASK_ID: ${{ inputs.task_id }}

      # API Vercel
      API_BASE: ${{ secrets.API_BASE }}

      # Secret komunikasi Worker <-> API
      WORKER_SECRET: ${{ secrets.WORKER_SECRET }}

      # GitHub API
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      GH_BRANCH: main

      # Google Drive
      GDRIVE_FOLDER: ${{ secrets.GDRIVE_FOLDER }}

      # CI indicator
      CI: "true"

      # Playwright
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright

    steps:

      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # --------------------------------------------------
      # 2. Setup Python
      # --------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: worker/requirements.txt

      # --------------------------------------------------
      # 3. Upgrade pip
      # --------------------------------------------------
      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip setuptools wheel

      # --------------------------------------------------
      # 4. Install Python dependencies
      # --------------------------------------------------
      - name: Install worker dependencies
        run: |
          pip install -r worker/requirements.txt

      # --------------------------------------------------
      # 5. Install Chromium + Linux dependencies
      # --------------------------------------------------
      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      # --------------------------------------------------
      # 6. Verify Playwright installation
      # --------------------------------------------------
      - name: Verify Playwright
        run: |
          python - <<'PY'
          import sys
          import playwright
          from playwright.sync_api import sync_playwright

          print("Python:", sys.version)
          print("Playwright:", playwright.__version__)

          with sync_playwright() as p:
              browser = p.chromium.launch(
                  headless=True,
                  args=[
                      "--no-sandbox",
                      "--disable-setuid-sandbox",
                      "--disable-dev-shm-usage",
                      "--disable-gpu"
                  ]
              )

              page = browser.new_page()
              page.goto("https://example.com", wait_until="domcontentloaded")

              print("Browser:", browser.version)
              print("Title:", page.title())

              browser.close()

          print("Playwright Chromium OK")
          PY

      # --------------------------------------------------
      # 7. Check worker files
      # --------------------------------------------------
      - name: Verify worker
        run: |
          test -f worker/main.py
          test -f worker/requirements.txt

          echo "Worker:"
          ls -lah worker/

      # --------------------------------------------------
      # 8. Run worker
      # --------------------------------------------------
      - name: Run Puppeter worker
        run: |
          python worker/main.py

      # --------------------------------------------------
      # 9. Upload diagnostic logs if failed
      # --------------------------------------------------
      - name: Upload worker diagnostics
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: puppeter-worker-${{ inputs.task_id }}
          path: |
            worker/
            .playwright/
          retention-days: 7
