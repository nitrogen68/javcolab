name: Puppeter Worker

on:
  repository_dispatch:
    types:
      - jav-task

  workflow_dispatch:
    inputs:
      task_id:
        description: "Task ID yang akan diproses"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: puppeter-worker-${{ github.event.client_payload.task_id || inputs.task_id || github.run_id }}
  cancel-in-progress: false

jobs:
  worker:
    name: Run Puppeter / Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      TASK_ID: ${{ github.event.client_payload.task_id || inputs.task_id }}
      API_BASE: ${{ secrets.API_BASE }}
      WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
      GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
      GH_REPO: ${{ secrets.GH_REPO || github.repository }}
      GH_BRANCH: ${{ vars.GH_BRANCH || 'main' }}
      GDRIVE_FOLDER: ${{ secrets.GDRIVE_FOLDER || vars.GDRIVE_FOLDER || 'javColab' }}
      DOOD_API_KEY: ${{ secrets.DOOD_API_KEY }}
      CI: "true"
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install worker dependencies
        run: |
          python -m pip install -r worker/requirements.txt

      - name: Install Playwright Chromium + system deps
        run: |
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg >/dev/null || true

      - name: Verify Playwright
        run: |
          python - <<'PY'
          import sys
          import importlib.metadata
          from playwright.sync_api import sync_playwright

          print("Python:", sys.version)
          print("Playwright:", importlib.metadata.version("playwright"))

          with sync_playwright() as p:
              browser = p.chromium.launch(
                  headless=True,
                  args=[
                      "--no-sandbox",
                      "--disable-setuid-sandbox",
                      "--disable-dev-shm-usage",
                      "--disable-gpu"
                  ]
              )
              page = browser.new_page()
              page.goto("https://example.com", wait_until="domcontentloaded")
              print("Browser:", browser.version)
              print("Title:", page.title())
              browser.close()

          print("Playwright Chromium OK")
          PY

      - name: Validate worker configuration
        run: |
          test -n "$TASK_ID" || (echo "TASK_ID kosong — pastikan client_payload.task_id terisi saat repository_dispatch" && exit 1)
          test -n "$API_BASE" || (echo "API_BASE kosong (secret)" && exit 1)
          test -n "$WORKER_SECRET" || (echo "WORKER_SECRET kosong (secret)" && exit 1)
          test -f worker/main.py || (echo "worker/main.py tidak ada" && exit 1)
          echo "TASK_ID=$TASK_ID"
          echo "API_BASE=$API_BASE"
          echo "GH_REPO=$GH_REPO"
          echo "GH_BRANCH=$GH_BRANCH"
          ls -lah worker/

      - name: Run Puppeter / Playwright
        run: |
          python worker/main.py "$TASK_ID"

      - name: Upload worker diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: puppeter-worker-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            worker/
            .playwright/
          retention-days: 7
