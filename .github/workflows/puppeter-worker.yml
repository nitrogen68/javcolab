name: Puppeter Worker

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: "Task ID yang akan diproses"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: puppeter-worker-${{ inputs.task_id }}
  cancel-in-progress: false

jobs:
  worker:
    name: Run Puppeter / Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      TASK_ID: ${{ inputs.task_id }}
      API_BASE: ${{ secrets.API_BASE }}
      WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      GH_BRANCH: main
      GDRIVE_FOLDER: ${{ secrets.GDRIVE_FOLDER }}
      CI: "true"
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install worker dependencies
        run: |
          pip install -r worker/requirements.txt

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Verify Playwright
        run: |
          python - <<'PY'
          import sys
          import playwright
          from playwright.sync_api import sync_playwright

          print("Python:", sys.version)
          print("Playwright:", playwright.__version__)

          with sync_playwright() as p:
              browser = p.chromium.launch(
                  headless=True,
                  args=[
                      "--no-sandbox",
                      "--disable-setuid-sandbox",
                      "--disable-dev-shm-usage",
                      "--disable-gpu"
                  ]
              )

              page = browser.new_page()
              page.goto(
                  "https://example.com",
                  wait_until="domcontentloaded"
              )

              print("Browser:", browser.version)
              print("Title:", page.title())

              browser.close()

          print("Playwright Chromium OK")
          PY

      - name: Verify worker
        run: |
          test -f worker/main.py
          test -f worker/requirements.txt
          echo "Worker files:"
          ls -lah worker/

      - name: Run Puppeter / Playwright
        run: |
          python worker/main.py

      - name: Upload worker diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: puppeter-worker-${{ inputs.task_id }}
          path: |
            worker/
            .playwright/
          retention-days: 7
